name: motion_ai
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Core
  equatable: ^2.0.7
  dartz: ^0.10.1

  # State Management
  flutter_riverpod: ^3.1.0

  # Storage
  hive: ^2.2.3
  hive_generator: ^2.0.1
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # Networking
  dio: ^5.9.0
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0
  http_parser: ^4.1.2

  # Audio
  flutter_sound: ^9.30.0
  permission_handler: ^12.0.1
  just_audio: ^0.10.5
  audio_waveforms: ^1.2.0

  # Sensors
  sensors_plus: ^6.1.1
  proximity_sensor: ^1.3.10

  # UI
  flutter_svg: ^2.2.3
  liquid_glass_renderer: ^0.2.0-dev.4

  # HTML rendering (for notes display)
  flutter_html: ^3.0.0
  html: ^0.15.4

  # Quill Editor (LATEST WORKING)
  flutter_quill: ^11.5.0

  # Convert Delta → HTML
  vsc_quill_delta_to_html: ^1.0.5

  # Utils
  uuid: ^4.5.3

  # Leave intl flexible (Flutter will pin correct version)
  intl: any
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  test_cov_console: ^0.2.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1E3A0F"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/meeting_notes.png
    - assets/images/google_logo.png
    - assets/images/facebook_logo.png
    - assets/images/google_meet.png
    - assets/images/send.png
    - assets/images/default_avatar.png

  fonts:
    - family: sf_pro
      fonts:
        - asset: assets/fonts/sf_pro_regular.OTF
          weight: 400
        - asset: assets/fonts/sf_pro_medium.OTF
          weight: 500

    - family: play_fair_display
      fonts:
        - asset: assets/fonts/play_fair_display.ttf
          weight: 500

    - family: poppins_regular
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
